<!-- Apply the saved theme before the page paints to avoid a dark flash. -->
<script>
  try {
    if (localStorage.getItem('cit:theme') === 'light') {
      document.documentElement.dataset.theme = 'light';
    }
  } catch (e) {}
</script>
